<title>LogR</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400;0,500;0,600;0,700&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
/* ============================================================
   LogR — tokens. Light palette complete on :root; dark redefines.
   Every colour validated (see docs/18-design-system.md).
   ============================================================ */
:root{
  --plane:#F3F3F1; --s1:#FCFCFB; --s2:#FFFFFF; --s3:#F0EFEC;
  --line:rgba(11,11,11,.10); --line-strong:rgba(11,11,11,.18);
  --ink:#0B0B0B; --ink2:#52514E; --ink3:#898781;
  --grid:#E1E0D9; --axis:#C3C2B7;
  --profit:#1baf7a; --loss:#e34948; --profit-dim:rgba(27,175,122,.16); --loss-dim:rgba(227,73,72,.16);
  --c1:#2a78d6; --c2:#eda100; --c3:#e87ba4;
  --good:#0ca30c; --warn:#fab219; --serious:#ec835a; --crit:#d03b3b;
  --focus:#2a78d6;
  --ui:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r-card:12px; --r-ctl:8px;
  --shadow:0 8px 28px rgba(11,11,11,.16);
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --plane:#0A0B0D; --s1:#12141A; --s2:#191C23; --s3:#1F232B;
  --line:rgba(255,255,255,.08); --line-strong:rgba(255,255,255,.16);
  --ink:#F4F5F7; --ink2:#9BA1AC; --ink3:#6B7280;
  --grid:#22262E; --axis:#2E333D;
  --profit:#199e70; --loss:#e66767; --profit-dim:rgba(25,158,112,.18); --loss-dim:rgba(230,103,103,.18);
  --c1:#3987e5; --c2:#c98500; --c3:#d55181;
  --focus:#3987e5;
  --shadow:0 10px 34px rgba(0,0,0,.55);
}}
:root[data-theme="dark"]{
  --plane:#0A0B0D; --s1:#12141A; --s2:#191C23; --s3:#1F232B;
  --line:rgba(255,255,255,.08); --line-strong:rgba(255,255,255,.16);
  --ink:#F4F5F7; --ink2:#9BA1AC; --ink3:#6B7280;
  --grid:#22262E; --axis:#2E333D;
  --profit:#199e70; --loss:#e66767; --profit-dim:rgba(25,158,112,.18); --loss-dim:rgba(230,103,103,.18);
  --c1:#3987e5; --c2:#c98500; --c3:#d55181;
  --focus:#3987e5;
  --shadow:0 10px 34px rgba(0,0,0,.55);
}
:root[data-cvd="on"]{ --loss:#d95926; --loss-dim:rgba(217,89,38,.18); }

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--plane);color:var(--ink);
  font-family:var(--ui);font-size:15px;line-height:1.45;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:4px}

/* ---------- shell ---------- */
#app{max-width:460px;margin:0 auto;min-height:100%;background:var(--plane);
     display:flex;flex-direction:column;position:relative}
.scroll{flex:1;overflow-y:auto;padding:0 16px;padding-block:14px 96px}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--plane);
        display:flex;align-items:center;gap:10px;padding:10px 16px 8px;border-bottom:1px solid transparent}
.topbar.sep{border-bottom-color:var(--line)}
.topbar h1{margin:0;font-size:17px;font-weight:600;letter-spacing:-.01em;flex:1}
.back{font-size:14px;color:var(--ink2);display:flex;align-items:center;gap:5px;padding:4px 2px}
.iconbtn{width:32px;height:32px;border-radius:var(--r-ctl);display:grid;place-items:center;color:var(--ink2)}
.iconbtn:hover{background:var(--s3)}

/* ---------- tabbar ---------- */
.tabbar{position:fixed;bottom:0;left:0;right:0;z-index:30;
  background:color-mix(in srgb,var(--plane) 88%,transparent);backdrop-filter:blur(14px);
  border-top:1px solid var(--line);
  padding:6px 0 calc(6px + env(safe-area-inset-bottom,0px));}
.tabbar-inner{max-width:460px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 0;color:var(--ink3);font-size:10px;font-weight:500}
.tab[aria-current="page"]{color:var(--ink)}
.tab svg{width:20px;height:20px}

/* ---------- primitives ---------- */
.card{background:var(--s1);border:1px solid var(--line);border-radius:var(--r-card);padding:16px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.eyebrow{font-size:10.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--ink3)}
.muted{color:var(--ink2)}
.tiny{font-size:11px;color:var(--ink3)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.pos{color:var(--profit)} .neg{color:var(--loss)}
.sectionhead{display:flex;align-items:baseline;justify-content:space-between;margin:20px 2px 8px}
.sectionhead h2{margin:0;font-size:13px;font-weight:600;letter-spacing:.02em}
.link{font-size:12.5px;color:var(--ink2);font-weight:500}
.divider{height:1px;background:var(--line);margin:12px -16px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;
      padding:3px 8px;border-radius:999px;border:1px solid var(--line);color:var(--ink2);white-space:nowrap}
.pill.p{color:var(--profit);border-color:color-mix(in srgb,var(--profit) 40%,transparent);background:var(--profit-dim)}
.pill.l{color:var(--loss);border-color:color-mix(in srgb,var(--loss) 40%,transparent);background:var(--loss-dim)}
.est{font-size:9.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);
     border:1px dashed var(--line-strong);border-radius:4px;padding:1px 4px}

/* ---------- hero / score ---------- */
.hero{background:var(--s1);border:1px solid var(--line);border-radius:var(--r-card);padding:18px 16px}
.hero-top{display:flex;align-items:flex-start;justify-content:space-between;gap:14px}
.hero-fig{font-size:52px;line-height:.95;font-weight:600;letter-spacing:-.03em}
.hero-sub{font-size:12.5px;color:var(--ink2);margin-top:6px}
.grade{font-family:var(--mono);font-size:20px;font-weight:700;padding:5px 10px;border-radius:var(--r-ctl);
       background:var(--s3);border:1px solid var(--line)}
.meter{height:5px;border-radius:3px;background:var(--s3);overflow:hidden;margin-top:14px}
.meter i{display:block;height:100%;border-radius:3px;background:var(--c1)}

.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);
      border:1px solid var(--line);border-radius:var(--r-card);overflow:hidden}
.kpi{background:var(--s1);padding:12px 10px}
.kpi .v{font-size:19px;font-weight:600;letter-spacing:-.02em;font-family:var(--mono);font-variant-numeric:tabular-nums}
.kpi .k{font-size:10.5px;color:var(--ink3);margin-top:3px;font-weight:500}

/* ---------- insight ---------- */
.insight{background:var(--s1);border:1px solid var(--line);border-left:3px solid var(--c2);
         border-radius:var(--r-card);padding:14px 15px}
.insight p{margin:7px 0 0;font-size:14px;line-height:1.5}
.insight .cta{margin-top:11px;font-size:12.5px;font-weight:600;color:var(--c1)}

/* ---------- calendar ---------- */
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.dow{font-size:9.5px;color:var(--ink3);text-align:center;font-weight:600;letter-spacing:.04em;padding-bottom:2px}
.cell{aspect-ratio:1;border-radius:6px;border:1px solid var(--line);background:var(--s1);
      display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:2px;
      font-family:var(--mono);cursor:pointer;position:relative}
.cell.void{background:transparent;border-color:transparent;cursor:default}
.cell .d{font-size:8.5px;color:var(--ink3);line-height:1}
.cell .v{font-size:9.5px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.cell.sel{outline:2px solid var(--focus);outline-offset:1px}
.callegend{display:flex;align-items:center;gap:6px;font-size:10.5px;color:var(--ink3);margin-top:10px}
.swatch{width:13px;height:13px;border-radius:3px;border:1px solid var(--line)}

/* ---------- segmented ---------- */
.seg{display:inline-flex;background:var(--s3);border:1px solid var(--line);border-radius:var(--r-ctl);padding:2px;gap:2px}
.seg button{font-size:11.5px;font-weight:600;padding:5px 10px;border-radius:6px;color:var(--ink3)}
.seg button[aria-pressed="true"]{background:var(--s1);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.14)}

/* ---------- trade list ---------- */
.tlist{display:flex;flex-direction:column;gap:1px;background:var(--line);border:1px solid var(--line);
       border-radius:var(--r-card);overflow:hidden}
.trow{background:var(--s1);display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;
      padding:11px 13px;text-align:left;width:100%}
.trow:hover{background:var(--s2)}
.dirdot{width:7px;height:7px;border-radius:2px}
.trow .mid .t1{font-size:13.5px;font-weight:600;letter-spacing:-.01em}
.trow .mid .t2{font-size:11px;color:var(--ink3);margin-top:1px}
.trow .end{text-align:right}
.trow .end .p{font-size:14px;font-weight:600;font-family:var(--mono);font-variant-numeric:tabular-nums}
.trow .end .r{font-size:10.5px;color:var(--ink3);font-family:var(--mono)}

/* ---------- chart ---------- */
.chartwrap{background:var(--s1);border:1px solid var(--line);border-radius:var(--r-card);overflow:hidden}
svg.chart{display:block;width:100%;height:auto;touch-action:manipulation}
.chart text{font-family:var(--mono);font-size:8.5px;fill:var(--ink3)}
.chart .lbl{font-family:var(--ui);font-size:8.5px;font-weight:700}

/* ---------- score rows ---------- */
.srow{display:grid;grid-template-columns:18px 1fr auto;gap:10px;align-items:start;padding:9px 0;border-top:1px solid var(--line)}
.srow:first-of-type{border-top:none}
.srow .mk{font-size:13px;line-height:1.3;text-align:center}
.srow .nm{font-size:13px;font-weight:500}
.srow .nt{font-size:11.5px;color:var(--ink3);margin-top:2px;line-height:1.4}
.srow .sc{font-family:var(--mono);font-size:12px;color:var(--ink2);white-space:nowrap;padding-top:1px}

/* ---------- legs table ---------- */
.tblwrap{overflow-x:auto}
table.legs{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:11.5px;font-variant-numeric:tabular-nums}
table.legs th{text-align:right;font-family:var(--ui);font-size:10px;font-weight:600;color:var(--ink3);
              padding:5px 7px;border-bottom:1px solid var(--line);white-space:nowrap}
table.legs th:first-child,table.legs td:first-child{text-align:left}
table.legs td{text-align:right;padding:6px 7px;border-bottom:1px solid var(--line);white-space:nowrap}
table.legs tr:last-child td{border-bottom:none}

/* ---------- chips ---------- */
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{font-size:12px;font-weight:500;padding:7px 11px;border-radius:999px;border:1px solid var(--line);
      background:var(--s1);color:var(--ink2);min-height:34px;display:inline-flex;align-items:center}
.chip[aria-pressed="true"]{background:color-mix(in srgb,var(--c1) 16%,var(--s1));
      border-color:color-mix(in srgb,var(--c1) 55%,transparent);color:var(--ink);font-weight:600}

/* ---------- review ---------- */
.dots{display:flex;gap:4px;flex:1}
.dot{height:3px;flex:1;border-radius:2px;background:var(--s3)}
.dot.done{background:var(--profit)} .dot.now{background:var(--c1)}
.timer{font-family:var(--mono);font-size:12px;color:var(--ink3);font-variant-numeric:tabular-nums}
.btn{display:block;width:100%;text-align:center;padding:13px;border-radius:var(--r-ctl);
     font-size:14.5px;font-weight:600;background:var(--ink);color:var(--plane);min-height:46px}
.btn.ghost{background:var(--s1);color:var(--ink);border:1px solid var(--line-strong)}
.hint{font-size:11.5px;color:var(--ink3);text-align:center;margin-top:9px}
.done-fig{font-size:44px;font-weight:600;letter-spacing:-.03em;font-family:var(--mono)}

/* ---------- cost ---------- */
.bar{height:26px;border-radius:5px;background:var(--s3);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.costgrid{width:100%;border-collapse:collapse;font-size:12.5px}
.costgrid th{font-size:10px;font-weight:600;color:var(--ink3);text-align:right;padding:6px 8px;border-bottom:1px solid var(--line)}
.costgrid th:first-child{text-align:left}
.costgrid td{text-align:right;padding:8px;border-bottom:1px solid var(--line);
             font-family:var(--mono);font-variant-numeric:tabular-nums}
.costgrid td:first-child{text-align:left;font-family:var(--ui)}
.costgrid tr:last-child td{border-bottom:none}

.banner{background:var(--s3);border:1px solid var(--line);border-radius:var(--r-ctl);
        padding:9px 12px;font-size:11.5px;color:var(--ink2);display:flex;gap:8px;align-items:flex-start}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.fade{animation:fade .18s ease-out}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
</style>
<style>
/* ---- v2 additions ---- */
.chartcard{background:var(--s1);border:1px solid var(--line);border-radius:var(--r-card);padding:14px 14px 10px}
.chartcard h3{margin:0;font-size:13.5px;font-weight:600;letter-spacing:-.01em}
.chartcard .sub{font-size:11.5px;color:var(--ink3);margin-top:2px;line-height:1.45}
.chartcard .note{font-size:12px;color:var(--ink2);margin-top:10px;line-height:1.5;
  border-top:1px solid var(--line);padding-top:10px}
svg.viz{display:block;width:100%;height:auto;margin-top:12px;overflow:visible}
svg.viz text{font-family:var(--mono);font-size:8px;fill:var(--ink3)}
svg.viz text.cat{font-family:var(--ui);font-size:9px;fill:var(--ink2);font-weight:500}
svg.viz text.val{font-family:var(--mono);font-size:8.5px;font-weight:700}
svg.viz text.ttl{font-family:var(--ui);font-size:8.5px;fill:var(--ink3)}

.kpi6{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);
      border:1px solid var(--line);border-radius:var(--r-card);overflow:hidden}
.kpi6 .c{background:var(--s1);padding:11px 9px}
.kpi6 .v{font-size:17px;font-weight:600;font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.kpi6 .k{font-size:9.5px;color:var(--ink3);margin-top:2px;font-weight:500;line-height:1.25}
.kpi6 .x{font-size:9px;color:var(--ink3);font-family:var(--mono)}

.grpttl{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);margin:12px 0 7px}
.grpttl:first-child{margin-top:0}
textarea.note{width:100%;background:var(--s2);border:1px solid var(--line);border-radius:var(--r-ctl);
  color:var(--ink);font:inherit;font-size:13.5px;padding:10px;min-height:84px;resize:vertical}
textarea.note::placeholder{color:var(--ink3)}
.notepv{font-size:13px;line-height:1.5;color:var(--ink2);background:var(--s2);border-left:2px solid var(--c1);
  padding:9px 11px;border-radius:0 var(--r-ctl) var(--r-ctl) 0}

.drawbar{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.drawbar button{font-size:11.5px;font-weight:600;padding:6px 10px;border-radius:var(--r-ctl);
  border:1px solid var(--line);background:var(--s2);color:var(--ink2)}
.drawbar button[aria-pressed="true"]{background:color-mix(in srgb,var(--c1) 18%,var(--s1));
  border-color:color-mix(in srgb,var(--c1) 55%,transparent);color:var(--ink)}
.readout{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.readout div{background:var(--s2);border:1px solid var(--line);border-radius:var(--r-ctl);padding:7px 8px}
.readout .k{font-size:9px;color:var(--ink3);font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.readout .v{font-size:13px;font-weight:600;font-family:var(--mono);margin-top:2px}

.filters{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;-webkit-overflow-scrolling:touch}
.filters::-webkit-scrollbar{display:none}
.wkrow{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;
  background:var(--s1);padding:11px 13px;text-align:left;width:100%}
.wkrow:hover{background:var(--s2)}
.tag{display:inline-flex;align-items:center;font-size:10px;font-weight:600;padding:2px 6px;border-radius:4px;
  background:var(--s3);color:var(--ink2);border:1px solid var(--line)}
.legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:9px;font-size:10.5px;color:var(--ink3)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:9px;height:9px;border-radius:2px;display:inline-block}
</style>

  <div class="scroll" id="view"></div>
  <nav class="tabbar" aria-label="Sections"><div class="tabbar-inner" id="tabs"></div></nav>

<script>
/* ==========================================================================
   LogR prototype v2 — synthetic XAUUSD data. No real account data anywhere.
   ========================================================================== */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const rnd=mulberry32(20260919);
const R=()=>rnd(), RI=(a,b)=>a+Math.floor(rnd()*(b-a+1)), RF=(a,b)=>a+rnd()*(b-a);
const pick=a=>a[Math.floor(rnd()*a.length)];
const OZ=100, TODAY=new Date(2026,8,18), FLOAT=200;

/* ---------- taxonomy ---------- */
const SETUPS=[
 {n:'Zone reversal',    w:.30, edge:+.10},
 {n:'Sweep continuation',w:.24, edge:+.16},
 {n:'SNR flip',         w:.14, edge:+.04},
 {n:'ORB',              w:.12, edge:-.02},
 {n:'Trendline bounce', w:.10, edge:-.06},
 {n:'SMT divergence',   w:.06, edge:+.24},
 {n:'News impact',      w:.04, edge:-.14},
];
/* edge = true marginal contribution to R, which the analytics should recover */
const CONF_GROUPS=[
 {g:'Structure',  items:[['BOS',.12],['CHoCH',.10],['MSS',.08],['HTF bias aligned',.22],['Trendline respect',-.02]]},
 {g:'Liquidity',  items:[['Liquidity sweep',.30],['Equal highs/lows',.14],['Inducement',.09],['Session high/low sweep',.16],['Asian range sweep',.11]]},
 {g:'POI / zone', items:[['Order block',.13],['Breaker block',.07],['Mitigation block',.05],['FVG / imbalance',.10],['Supply / demand zone',.08],['SNR level',.06]]},
 {g:'Level',      items:[['Fib OTE',.01],['Premium / discount',.12],['Round number',-.01],['PDH / PDL',.09],['Weekly open',.03]]},
 {g:'Correlation',items:[['SMT divergence',.27],['DXY alignment',.15]]},
 {g:'Timing',     items:[['London killzone',.18],['NY killzone',.13],['ORB window',-.03],['News window',-.20]]},
];
const CONF=CONF_GROUPS.flatMap(g=>g.items.map(([n,e])=>({n,e,g:g.g})));
const CONF_W=Object.fromEntries(CONF.map(c=>[c.n,c.e]));
const EMOTIONS=['Patient','Rushed','Confident','Hesitant','Frustrated','Bored','Focused'];
const MISTAKES=['Chased entry','Oversized','Moved stop','Held past invalidation','No setup','Revenge trade','Early exit','Traded news'];
const SESSIONS=[{k:'Asia',h:1,w:.09},{k:'London',h:8,w:.43},{k:'NY AM',h:13,w:.36},{k:'NY PM',h:17,w:.12}];

const NOTE_SEEDS=[
 'Clean sweep of the Asian high then instant reclaim. Layered three into the OB, full send.',
 'Took this because I was down on the day. No real confluence — just wanted it back.',
 'Perfect textbook setup. Waited 40 minutes for price to come to me.',
 'Entered before the sweep completed. Got run, re-entered lower, worked out but sloppy.',
 'DXY was making a lower high while gold made a higher low. SMT was screaming.',
 'News was 8 minutes away. Should not have been in this.',
 'Moved to BE too fast again. Got tagged then it ran 3R without me.',
 'Zone was too wide, average entry ended up poor. Tighten the zone next time.',
 'Held past my level hoping it would come back. It did not.',
 'Scaled out too early — took the first partial at 0.4R when target was 2.5R away.',
];

/* ---------- generation ---------- */
function buildDays(){
  const days=[]; let price=4288, id=0;
  for(let back=29;back>=0;back--){
    const d=new Date(TODAY); d.setDate(d.getDate()-back);
    const dow=d.getDay();
    price=Math.max(4180,Math.min(4470,price+RF(-26,30)));
    if(dow===0||dow===6){days.push({date:d,weekend:true,trades:[]});continue;}
    const rr=R();
    const regime=rr<.22?'Low':rr<.68?'Normal':rr<.92?'High':'Extreme';
    const atr={Low:14,Normal:26,High:44,Extreme:68}[regime]*RF(.85,1.15);
    const n = back<=25? RI(12,27):0;
    const trades=[];
    for(let i=0;i<n;i++) trades.push(mkTrade(id++,d,price,atr,regime,i));
    trades.sort((a,b)=>a.minute-b.minute).forEach((t,i)=>t.nOfDay=i+1);
    days.push({date:d,weekend:false,regime,atr,trades});
  }
  return days;
}

function mkTrade(id,date,dayPrice,atr,regime,seq){
  let r=R(),acc=0,ses=SESSIONS[1];
  for(const s of SESSIONS){acc+=s.w; if(r<=acc){ses=s;break;}}
  const minute=ses.h*60+RI(0,235);

  let sr=R(),sa=0,setup=SETUPS[0];
  for(const s of SETUPS){sa+=s.w; if(sr<=sa){setup=s;break;}}

  const dir=R()<.52?'long':'short', sign=dir==='long'?1:-1;
  const entry=dayPrice+RF(-atr*.45,atr*.45);
  const zoneH=atr*RF(.055,.14);
  const zoneLow = dir==='long'? entry-zoneH : entry-zoneH*RF(.2,.5);
  const zoneHigh=zoneLow+zoneH;

  // confluences — setup biases which ones appear
  const nConf=RI(3,7), conf=[];
  const prefer = setup.n==='SMT divergence'?['SMT divergence','DXY alignment']
               : setup.n==='Sweep continuation'?['Liquidity sweep','Session high/low sweep']
               : setup.n==='ORB'?['ORB window']
               : setup.n==='News impact'?['News window']
               : setup.n==='Trendline bounce'?['Trendline respect']
               : setup.n==='SNR flip'?['SNR level']:['Order block'];
  prefer.forEach(p=>{if(conf.length<nConf&&!conf.includes(p))conf.push(p);});
  while(conf.length<nConf){const c=pick(CONF).n; if(!conf.includes(c))conf.push(c);}
  const edgeSum = conf.reduce((s,c)=>s+CONF_W[c],0) + setup.edge;

  const layers=RI(2,5), lotPer=+(RF(.006,.016)).toFixed(3);
  const fillDepth=Math.min(1,RF(.25,1.15));
  const filled=Math.max(1,Math.round(layers*fillDepth));
  const chased=R()<.22;
  const legs=[];
  for(let i=0;i<filled;i++){
    const f=filled===1?0:i/(filled-1);
    let p = dir==='long'? zoneHigh-(zoneH*f) : zoneLow+(zoneH*f);
    if(chased&&i===filled-1) p += dir==='long'? zoneH*RF(.12,.45) : -zoneH*RF(.12,.45);
    legs.push({t:minute+i*RI(1,7),price:+p.toFixed(2),lots:lotPer});
  }
  const lots=+(lotPer*filled).toFixed(3);
  const avgEntry=+(legs.reduce((s,l)=>s+l.price,0)/legs.length).toFixed(2);
  const buffer=atr*RF(.035,.075);
  const invalidation=+((dir==='long'? zoneLow-buffer : zoneHigh+buffer)).toFixed(2);
  const riskDist=Math.abs(avgEntry-invalidation);
  const riskAmt=riskDist*OZ*lots;
  const plannedRR=+RF(1.6,3.6).toFixed(2);
  const target=+(avgEntry+sign*riskDist*plannedRR).toFixed(2);

  // outcome driven by the real edge, so the analytics can recover it
  const deepPen = fillDepth>.92? .10:0;
  // centred on the mean edge so the base win rate stays realistic
  // while the per-factor differential the analytics must recover is preserved
  const pWin = Math.max(.26, Math.min(.74, .515 + (edgeSum-0.50)*.40 - deepPen));
  const win = R()<pWin;
  // edge shows up in the size of winners too, not only in how often they happen
  const edgeGain = 1 + Math.max(-.35, Math.min(.45,(edgeSum-0.50)*.55));
  const rMult = win ? (RF(.40,1.15)+(R()<.22?RF(.4,1.6):0))*edgeGain
                    : -(RF(.30,.95)+(R()<.10?RF(.2,.5):0));
  const netPnl=+(rMult*riskAmt).toFixed(2);
  const mfeR = win? rMult+RF(.15,1.5) : RF(.1,.85);
  const maeR = win? RF(.05,.65) : Math.abs(rMult)+RF(0,.18);
  const hold=RI(3,34);

  const nOut = win? RI(2,3):1;
  const exits=[]; let rem=lots;
  for(let i=0;i<nOut;i++){
    const last=i===nOut-1;
    const part = last? +rem.toFixed(3) : +(lots*RF(.3,.45)).toFixed(3);
    rem=+(rem-part).toFixed(3);
    const frac=nOut===1?1:(i+1)/nOut;
    const px = win? avgEntry+sign*riskDist*rMult*frac*RF(.85,1.12)
                  : invalidation+sign*RF(-.25,.25)*buffer;
    exits.push({t:minute+hold*frac,price:+px.toFixed(2),lots:part,kind:last?(nOut===1?'stop-out':'runner'):'partial'});
    if(rem<=0)break;
  }
  const beMoved = win&&nOut>1&&R()<.72, beEarly = beMoved&&R()<.55;

  const t={id,date:new Date(date),minute,session:ses.k,dir,setup:setup.n,
    zoneLow:+zoneLow.toFixed(2),zoneHigh:+zoneHigh.toFixed(2),zoneH:+zoneH.toFixed(2),
    layers,filled,legs,lots,avgEntry,invalidation,target,plannedRR,
    riskDist:+riskDist.toFixed(2),riskAmt:+riskAmt.toFixed(2),
    rMult:+rMult.toFixed(2),netPnl,mfeR:+mfeR.toFixed(2),maeR:+maeR.toFixed(2),
    fillDepth:+Math.min(1,fillDepth).toFixed(2),hold,exits,beMoved,beEarly,conf,chased,
    regime,atr,dow:date.getDay(),
    spread:+RF(.15,.36).toFixed(2),
    heldPast: !win&&R()<.26, overSize: lots>.045,
    emotion: R()<.55? pick(EMOTIONS):null,
    mistakes: [],
    note: R()<.22? pick(NOTE_SEEDS):'',
    newsMin: R()<.14? RI(2,28) : null,
  };
  if(t.chased) t.mistakes.push('Chased entry');
  if(t.overSize) t.mistakes.push('Oversized');
  if(t.heldPast) t.mistakes.push('Held past invalidation');
  if(t.mfeR-t.rMult>1.2) t.mistakes.push('Early exit');
  if(t.newsMin!==null&&t.newsMin<15) t.mistakes.push('Traded news');
  t.spreadCost=+(t.spread*OZ*t.lots).toFixed(2);
  t.score=scoreTrade(t);
  return t;
}

function scoreTrade(t){
  const rows=[], cN=t.conf.length;
  rows.push({nm:'Setup validity',max:20,got:cN>=5?20:cN===4?15:cN===3?10:5,
    nt:`${cN} confluences: ${t.conf.slice(0,3).join(', ')}${cN>3?'…':''}`});
  rows.push({nm:'Zone discipline',max:15,got:t.chased?7:15,
    nt:t.chased?'Final layer filled outside the declared zone':'All entries inside the zone'});
  rows.push({nm:'Size discipline',max:20,got:t.overSize?8:20,
    nt:t.overSize?`Ladder reached ${t.lots} lots, above your 0.045 max`:`${t.filled}/${t.layers} layers · ${t.lots} lots`});
  rows.push({nm:'Invalidation honoured',max:15,got:t.heldPast?0:15,
    nt:t.heldPast?'Held past invalidation before exiting':'Exited at or before invalidation'});
  const early=t.mfeR-t.rMult>0.6;
  rows.push({nm:'Target discipline',max:15,got:early?8:15,
    nt:early?`Closed at ${t.rMult}R; planned target was ${t.plannedRR}R`:'Partials landed at planned levels'});
  rows.push({nm:'Breakeven timing',max:10,got:t.beEarly?0:10,
    nt:t.beEarly?'Runner moved to BE before price cleared the zone':(t.beMoved?'BE after the zone cleared':'No BE move needed')});
  const ctx = t.newsMin!==null&&t.newsMin<15? 0 : t.session==='Asia'? 2 : 5;
  rows.push({nm:'Context compliance',max:5,got:ctx,
    nt: ctx===0?`Entered ${t.newsMin}m from high-impact news`: ctx===2?'Asia session, outside allowed hours':`${t.session}, inside allowed hours`});
  return {total:rows.reduce((s,r)=>s+r.got,0),rows};
}

/* ---------- bars ---------- */
function barsFor(t){
  const g=mulberry32(t.id*7919+13), gf=(a,b)=>a+g()*(b-a);
  const n=76, pre=14, sign=t.dir==='long'?1:-1, vol=t.atr/260;
  const mfePx=t.avgEntry+sign*t.riskDist*t.mfeR, maePx=t.avgEntry-sign*t.riskDist*t.maeR;
  const last=t.exits[t.exits.length-1].price;
  const way=[[0,t.avgEntry+sign*t.riskDist*gf(.9,1.6)],[pre,t.legs[0].price],
    [pre+Math.round((n-pre)*.18),maePx],[pre+Math.round((n-pre)*.58),mfePx],
    [pre+Math.round((n-pre)*.74),last],
    [n-1,last+sign*t.riskDist*(t.rMult>0?gf(-.3,.9):gf(-.2,1.1))]];
  const bars=[]; let prev=way[0][1];
  for(let i=0;i<n;i++){
    let a=way[0],b=way[way.length-1];
    for(let k=0;k<way.length-1;k++) if(i>=way[k][0]&&i<=way[k+1][0]){a=way[k];b=way[k+1];break;}
    const f=b[0]===a[0]?0:(i-a[0])/(b[0]-a[0]);
    const base=a[1]+(b[1]-a[1])*(f*f*(3-2*f));
    const o=prev,c=base+(g()-.5)*vol*2.4;
    bars.push({o,h:Math.max(o,c)+g()*vol*1.6,l:Math.min(o,c)-g()*vol*1.6,c}); prev=c;
  }
  return {bars,pre,exitIdx:pre+Math.round((n-pre)*.74)};
}

/* ---------- aggregates ---------- */
const DAYS=buildDays(), ALL=DAYS.flatMap(d=>d.trades);
DAYS.forEach(d=>{
  d.net=+d.trades.reduce((s,t)=>s+t.netPnl,0).toFixed(2);
  d.rSum=+d.trades.reduce((s,t)=>s+t.rMult,0).toFixed(2);
  d.score=d.trades.length?Math.round(d.trades.reduce((s,t)=>s+t.score.total,0)/d.trades.length):null;
  d.cost=+d.trades.reduce((s,t)=>s+t.spreadCost,0).toFixed(2);
  d.wr=d.trades.length? d.trades.filter(t=>t.netPnl>0).length/d.trades.length : 0;
});
const TRADING=DAYS.filter(d=>d.trades.length);
const LAST=TRADING[TRADING.length-1];
const WEEKS=(()=>{const m=new Map();TRADING.forEach(d=>{const x=new Date(d.date);x.setDate(x.getDate()-((x.getDay()+6)%7));
  const k=x.toISOString().slice(0,10);if(!m.has(k))m.set(k,{start:new Date(x),days:[]});m.get(k).days.push(d);});
  return [...m.values()].map(w=>{const tr=w.days.flatMap(d=>d.trades);return{...w,trades:tr,...stats(tr)};});})();

function stats(list){
  const wins=list.filter(t=>t.netPnl>0), losses=list.filter(t=>t.netPnl<=0);
  const gp=wins.reduce((s,t)=>s+t.netPnl,0), gl=Math.abs(losses.reduce((s,t)=>s+t.netPnl,0));
  const aw=wins.length?gp/wins.length:0, al=losses.length?gl/losses.length:0;
  const payoff=al?aw/al:0;
  return {n:list.length,net:+list.reduce((s,t)=>s+t.netPnl,0).toFixed(2),
    wins:wins.length,losses:losses.length,wr:list.length?wins.length/list.length:0,
    gp:+gp.toFixed(2),gl:+gl.toFixed(2),pf:gl?gp/gl:0,avgWin:aw,avgLoss:al,payoff,
    beWR: payoff? 1/(1+payoff):0,
    expR: list.length? list.reduce((s,t)=>s+t.rMult,0)/list.length:0,
    rSum:+list.reduce((s,t)=>s+t.rMult,0).toFixed(2),
    plannedRR: list.length? list.reduce((s,t)=>s+t.plannedRR,0)/list.length:0,
    realisedR: list.length? list.reduce((s,t)=>s+t.rMult,0)/list.length:0,
    cost:+list.reduce((s,t)=>s+t.spreadCost,0).toFixed(2),
    lots:+list.reduce((s,t)=>s+t.lots,0).toFixed(2),
    score: list.length? Math.round(list.reduce((s,t)=>s+t.score.total,0)/list.length):0,
    orders: list.reduce((s,t)=>s+t.legs.length+t.exits.length,0)};
}
const S=stats(ALL);

/* ==========================================================================
   CHART PRIMITIVES — thin marks, recessive grid, direct labels, hover titles

function hbars(rows,o={}){
  // rows: [{label, value, n, hint}] — diverging around zero
  const rowH=o.rowH||21, padL=o.padL||96, padR=64, W=340, H=rows.length*rowH+16;
  const mx=Math.max(...rows.map(r=>Math.abs(r.value)),o.min||0.01);
  const z=padL+(W-padL-padR)/2, half=(W-padL-padR)/2;
  let s=`<svg class="viz" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.aria||'Comparison')}">`;
  s+=`<line x1="${z}" y1="6" x2="${z}" y2="${H-10}" stroke="var(--axis)" stroke-width="1"/>`;
  s+=`<line x1="${W-22}" y1="6" x2="${W-22}" y2="${H-10}" stroke="var(--line)" stroke-width="1"/>`;
  rows.forEach((r,i)=>{
    const y=8+i*rowH, w=Math.abs(r.value)/mx*half*.92;
    const x=r.value>=0? z : z-w;
    const col=r.value>=0?'var(--profit)':'var(--loss)';
    s+=`<text class="cat" x="${padL-7}" y="${y+rowH/2+1}" text-anchor="end">${esc(r.label)}</text>`;
    s+=`<rect x="${x.toFixed(1)}" y="${y+3}" width="${Math.max(2,w).toFixed(1)}" height="${rowH-9}" rx="3" fill="${col}"><title>${esc(r.label)}: ${o.fmt?o.fmt(r.value):r.value} (n=${r.n??'—'})</title></rect>`;
    s+=`<text class="val" x="${W-padR+4}" y="${y+rowH/2+1}" fill="${col}">${o.fmt?o.fmt(r.value):r.value}</text>`;
    if(r.n!=null) s+=`<text x="${W-2}" y="${y+rowH/2+1}" text-anchor="end" opacity=".7">${r.n}</text>`;
  });
  s+=`</svg>`; return s;
}

function histR(values,o={}){
  const W=340,H=132,L=8,Rr=8,T=8,B=20;
  const lo=Math.max(-3,Math.min(...values)), hi=Math.min(4,Math.max(...values));
  const nb=o.bins||16, step=(hi-lo)/nb;
  const bins=Array(nb).fill(0);
  values.forEach(v=>{const i=Math.min(nb-1,Math.max(0,Math.floor((v-lo)/step)));bins[i]++;});
  const mx=Math.max(...bins), pw=W-L-Rr, ph=H-T-B, bw=pw/nb;
  const X=v=>L+(v-lo)/(hi-lo)*pw;
  let s=`<svg class="viz" viewBox="0 0 ${W} ${H}" role="img" aria-label="Distribution of R multiples">`;
  s+=`<line x1="${L}" y1="${H-B}" x2="${W-Rr}" y2="${H-B}" stroke="var(--axis)" stroke-width="1"/>`;
  bins.forEach((c,i)=>{
    const h=c/mx*ph, x=L+i*bw, mid=lo+step*(i+.5);
    s+=`<rect x="${(x+1).toFixed(1)}" y="${(H-B-h).toFixed(1)}" width="${(bw-2).toFixed(1)}" height="${h.toFixed(1)}" rx="2"
        fill="${mid>=0?'var(--profit)':'var(--loss)'}" opacity=".9"><title>${mid.toFixed(2)}R · ${c} trades</title></rect>`;
  });
  s+=`<line x1="${X(0).toFixed(1)}" y1="${T}" x2="${X(0).toFixed(1)}" y2="${H-B}" stroke="var(--ink)" stroke-width="1" stroke-dasharray="3 3" opacity=".55"/>`;
  s+=`<text class="ttl" x="${X(0).toFixed(1)}" y="${H-7}" text-anchor="middle">0R</text>`;
  s+=`<text class="ttl" x="${L}" y="${H-7}">${lo.toFixed(1)}R</text>`;
  s+=`<text class="ttl" x="${W-Rr}" y="${H-7}" text-anchor="end">${hi.toFixed(1)}R</text>`;
  const mean=values.reduce((a,b)=>a+b,0)/values.length;
  s+=`<line x1="${X(mean).toFixed(1)}" y1="${T}" x2="${X(mean).toFixed(1)}" y2="${H-B}" stroke="var(--c1)" stroke-width="2"/>`;
  s+=`<text class="val" x="${X(mean).toFixed(1)}" y="${T+7}" text-anchor="middle" fill="var(--c1)">mean ${mean.toFixed(2)}R</text>`;
  s+=`</svg>`; return s;
}

function lineChart(pts,o={}){
  const W=340,H=o.h||124,L=8,Rr=40,T=10,B=16;
  const pw=W-L-Rr, ph=H-T-B;
  const mn=Math.min(0,...pts), mx=Math.max(...pts);
  const X=i=>L+(i/(pts.length-1))*pw, Y=v=>T+(1-(v-mn)/((mx-mn)||1))*ph;
  let peak=-1e9, dd=pts.map(v=>{peak=Math.max(peak,v);return v-peak;});
  const ddMin=Math.min(...dd);
  let s=`<svg class="viz" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.aria||'Cumulative curve')}">`;
  [0,.5,1].forEach(f=>{const y=T+f*ph;s+=`<line x1="${L}" y1="${y}" x2="${W-Rr}" y2="${y}" stroke="var(--grid)" stroke-width="1"/>`;});
  if(o.dd!==false&&ddMin<0){
    const dY=v=>T+ph-(v/ddMin)*(ph*.28);
    s+=`<path d="M${X(0)} ${T+ph} ${dd.map((v,i)=>`L${X(i).toFixed(1)} ${dY(v).toFixed(1)}`).join(' ')} L${X(pts.length-1).toFixed(1)} ${T+ph} Z" fill="var(--loss)" opacity=".16"/>`;
  }
  s+=`<polyline points="${pts.map((v,i)=>`${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join(' ')}" fill="none" stroke="var(--c1)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
  s+=`<circle cx="${X(pts.length-1).toFixed(1)}" cy="${Y(pts[pts.length-1]).toFixed(1)}" r="3.2" fill="var(--c1)"/>`;
  s+=`<text class="val" x="${W-Rr+5}" y="${(Y(pts[pts.length-1])+3).toFixed(1)}" fill="var(--c1)">${o.fmt?o.fmt(pts[pts.length-1]):pts[pts.length-1].toFixed(1)}</text>`;
  s+=`<text class="ttl" x="${W-Rr+5}" y="${T+ph+2}">max DD</text>`;
  s+=`<text class="val" x="${W-Rr+5}" y="${T+ph+11}" fill="var(--loss)">${o.fmt?o.fmt(ddMin):ddMin.toFixed(1)}</text>`;
  s+=`</svg>`; return s;
}

function heatGrid(cells,o={}){
  // cells: [{r,c,value,n}] with rowLabels / colLabels

  });

}

function scatterRR(pts){
  const W=340,H=170,L=30,Rr=12,T=10,B=24, pw=W-L-Rr, ph=H-T-B;
  const xmx=4, ymn=-2, ymx=4;
  const X=v=>L+Math.min(v,xmx)/xmx*pw, Y=v=>T+(1-(Math.max(ymn,Math.min(ymx,v))-ymn)/(ymx-ymn))*ph;
  let s=`<svg class="viz" viewBox="0 0 ${W} ${H}" role="img" aria-label="Planned R against realised R">`;
  [0,1,2,3,4].forEach(v=>{s+=`<line x1="${X(v).toFixed(1)}" y1="${T}" x2="${X(v).toFixed(1)}" y2="${T+ph}" stroke="var(--grid)" stroke-width="1"/>`;
    s+=`<text class="ttl" x="${X(v).toFixed(1)}" y="${H-12}" text-anchor="middle">${v}R</text>`;});

    s+=`<text class="ttl" x="${L-5}" y="${(Y(v)+3).toFixed(1)}" text-anchor="end">${v}R</text>`;});
  s+=`<line x1="${X(0)}" y1="${Y(0)}" x2="${X(4)}" y2="${Y(4)}" stroke="var(--ink3)" stroke-width="1.5" stroke-dasharray="4 4"/>`;
  s+=`<text class="ttl" x="${X(3.4).toFixed(1)}" y="${(Y(3.4)-5).toFixed(1)}">plan = result</text>`;
  s+=`<line x1="${L}" y1="${Y(0).toFixed(1)}" x2="${W-Rr}" y2="${Y(0).toFixed(1)}" stroke="var(--axis)" stroke-width="1"/>`;
  pts.forEach(p=>{s+=`<circle cx="${X(p.x).toFixed(1)}" cy="${Y(p.y).toFixed(1)}" r="2.6" fill="${p.y>=0?'var(--profit)':'var(--loss)'}" opacity=".55" stroke="var(--s1)" stroke-width=".6"/>`;});
  const ax=pts.reduce((s2,p)=>s2+p.x,0)/pts.length, ay=pts.reduce((s2,p)=>s2+p.y,0)/pts.length;
  s+=`<circle cx="${X(ax).toFixed(1)}" cy="${Y(ay).toFixed(1)}" r="5" fill="var(--c1)" stroke="var(--s1)" stroke-width="2"/>`;
  s+=`<text class="val" x="${(X(ax)+8).toFixed(1)}" y="${(Y(ay)+3).toFixed(1)}" fill="var(--c1)">avg ${ax.toFixed(1)} → ${ay.toFixed(2)}</text>`;
  s+=`<text class="ttl" x="${W/2}" y="${H-2}" text-anchor="middle">planned R:R →</text>`;
  s+=`</svg>`; return s;
}

/* ---------- segmentation ---------- */
function segment(list,keyFn,o={}){
  const m=new Map();
  list.forEach(t=>{const ks=keyFn(t); (Array.isArray(ks)?ks:[ks]).forEach(k=>{if(k==null)return;
    if(!m.has(k))m.set(k,[]); m.get(k).push(t);});});
  let rows=[...m.entries()].map(([k,v])=>({label:k,n:v.length,value:v.reduce((s,t)=>s+t.rMult,0)/v.length,
    net:v.reduce((s,t)=>s+t.netPnl,0),wr:v.filter(t=>t.netPnl>0).length/v.length,trades:v}));
  rows=rows.filter(r=>r.n>=(o.minN||8));
  rows.sort((a,b)=>o.byLabel? String(a.label).localeCompare(String(b.label)) : b.value-a.value);
  return o.top? rows.slice(0,o.top):rows;
}
/* marginal value: expectancy with the factor minus expectancy without it */
function marginal(list,factor){
  const w=list.filter(t=>t.conf.includes(factor)), wo=list.filter(t=>!t.conf.includes(factor));
  if(w.length<15||wo.length<15) return null;
  const ew=w.reduce((s,t)=>s+t.rMult,0)/w.length, en=wo.reduce((s,t)=>s+t.rMult,0)/wo.length;
  const sd=Math.sqrt(w.reduce((s,t)=>s+(t.rMult-ew)**2,0)/Math.max(1,w.length-1));
  return {label:factor,value:ew-en,n:w.length,ci:1.96*sd/Math.sqrt(w.length)};
}

function chartSVG(t,opt={}){
  const {bars,pre,exitIdx}=barsFor(t);
  const W=340,H=196,L=8,Rp=34,T=12,B=16, pw=W-L-Rp, ph=H-T-B;
  const inval=opt.invalidation??t.invalidation, tgt=opt.target??t.target;
  const zl=opt.zoneLow??t.zoneLow, zh=opt.zoneHigh??t.zoneHigh;
  let lo=Math.min(...bars.map(b=>b.l),inval,zl), hi=Math.max(...bars.map(b=>b.h),inval,zh);
  if(opt.showTarget!==false){lo=Math.min(lo,tgt);hi=Math.max(hi,tgt);}
  const pad=(hi-lo)*.10; lo-=pad; hi+=pad;
  const X=i=>L+(i/(bars.length-1))*pw, Y=p=>T+(1-(p-lo)/(hi-lo))*ph;
  const cw=Math.max(1.6,pw/bars.length*.56);
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Price around the trade with entries, exits, zone and invalidation marked">`;
  s+=`<rect x="${X(exitIdx).toFixed(1)}" y="${T}" width="${(W-Rp-X(exitIdx)).toFixed(1)}" height="${ph}" fill="var(--ink3)" opacity=".07"/>`;
  s+=`<text class="lbl" x="${(X(exitIdx)+4).toFixed(1)}" y="${(H-B-3).toFixed(1)}" fill="var(--ink3)">after exit</text>`;
  const zy=Y(zh), zhh=Math.max(2,Y(zl)-Y(zh));
  s+=`<rect x="${L}" y="${zy.toFixed(1)}" width="${pw}" height="${zhh.toFixed(1)}" fill="var(--c1)" opacity=".13"/>`;
  s+=`<rect x="${L}" y="${zy.toFixed(1)}" width="${pw}" height="${zhh.toFixed(1)}" fill="none" stroke="var(--c1)" stroke-opacity=".5" stroke-width="1"/>`;
  s+=`<text class="lbl" x="${L+4}" y="${(zy+zhh/2+3).toFixed(1)}" fill="var(--c1)">zone</text>`;
  bars.forEach((b,i)=>{const x=X(i);
    s+=`<line x1="${x.toFixed(1)}" y1="${Y(b.h).toFixed(1)}" x2="${x.toFixed(1)}" y2="${Y(b.l).toFixed(1)}" stroke="var(--ink3)" stroke-opacity=".5" stroke-width="1"/>`;
    const y1=Y(Math.max(b.o,b.c)),y2=Y(Math.min(b.o,b.c));
    s+=`<rect x="${(x-cw/2).toFixed(1)}" y="${y1.toFixed(1)}" width="${cw.toFixed(1)}" height="${Math.max(1,y2-y1).toFixed(1)}" fill="var(--ink3)" opacity="${b.c>=b.o?.42:.78}"/>`;});
  if(opt.showTarget!==false){
    s+=`<line x1="${L}" y1="${Y(tgt).toFixed(1)}" x2="${W-Rp}" y2="${Y(tgt).toFixed(1)}" stroke="var(--profit)" stroke-width="1.5" stroke-dasharray="5 4"/>`;
    s+=`<text class="lbl" x="${L+4}" y="${(Y(tgt)-4).toFixed(1)}" fill="var(--profit)">target</text>`;}
  s+=`<line x1="${L}" y1="${Y(inval).toFixed(1)}" x2="${W-Rp}" y2="${Y(inval).toFixed(1)}" stroke="var(--loss)" stroke-width="1.5" stroke-dasharray="5 4"/>`;
  s+=`<text class="lbl" x="${L+4}" y="${(Y(inval)+(Y(inval)<T+18?10:-4)).toFixed(1)}" fill="var(--loss)">invalidation</text>`;
  t.legs.forEach((l,i)=>{const x=X(pre+i*2),y=Y(l.price);
    s+=`<path d="M${(x-4).toFixed(1)} ${(y-3.5).toFixed(1)} L${(x+1.5).toFixed(1)} ${y.toFixed(1)} L${(x-4).toFixed(1)} ${(y+3.5).toFixed(1)} Z" fill="var(--c1)"/>`;});
  s+=`<text class="lbl" x="${Math.max(L+16,X(pre)).toFixed(1)}" y="${Math.max(T+8,Y(t.legs[0].price)-8).toFixed(1)}" fill="var(--c1)" text-anchor="middle">${t.legs.length} in</text>`;
  t.exits.forEach((e,i)=>{const x=X(Math.min(bars.length-1,exitIdx-(t.exits.length-1-i)*3)),y=Y(e.price);
    s+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3.4" fill="var(--s1)" stroke="var(--ink)" stroke-width="1.6"/>`;});
  const le=t.exits[t.exits.length-1];
  s+=`<text class="lbl" x="${X(exitIdx).toFixed(1)}" y="${Math.max(T+8,Y(le.price)-9).toFixed(1)}" fill="var(--ink)" text-anchor="end">${t.exits.length} out</text>`;
  [hi-pad*.55,lo+pad*.55].forEach(p=>s+=`<text x="${W-4}" y="${(Y(p)+3).toFixed(1)}" text-anchor="end" fill="var(--ink3)" opacity=".75">${p.toFixed(1)}</text>`);
  s+=`</svg>`;
  return {svg:s,lo,hi,T,ph,H};
}

function setDraw(m){ST.draw.mode=ST.draw.mode===m?null:m;render();}
function saveNote(id,v){const t=ALL.find(x=>x.id===id);if(t)t.note=v;}
function setEmotion(id,e){const t=ALL.find(x=>x.id===id);t.emotion=t.emotion===e?null:e;render();}
function toggleMistake(id,m){const t=ALL.find(x=>x.id===id);const i=t.mistakes.indexOf(m);
  i>=0?t.mistakes.splice(i,1):t.mistakes.push(m);render();}

function bindDraw(){
  const host=document.getElementById('drawchart'); if(!host)return;
  const svg=host.querySelector('svg'); if(!svg)return;
  const t=ALL.find(x=>x.id===ST.trade), D=ST.draw;
  const meta=chartSVG(t,{invalidation:D.inval??t.invalidation,target:D.target??t.target,
    zoneLow:D.zone?Math.min(...D.zone):t.zoneLow,zoneHigh:D.zone?Math.max(...D.zone):t.zoneHigh});
  const toPrice=e=>{const r=svg.getBoundingClientRect();
    const y=(e.clientY-r.top)/r.height*meta.H;
    return +(meta.hi-(meta.hi-meta.lo)*Math.max(0,Math.min(1,(y-meta.T)/meta.ph))).toFixed(2);};
  if(D.mode) svg.style.cursor='crosshair';
  svg.addEventListener('pointerdown',e=>{ if(!D.mode)return; e.preventDefault();
    if(D.mode==='zone'){ D.anchor=toPrice(e); }
    else { D.mode==='inval'? D.inval=toPrice(e) : D.target=toPrice(e); render(); }});
  svg.addEventListener('pointerup',e=>{ if(D.mode!=='zone'||D.anchor==null)return;
    const b=toPrice(e); D.zone=[D.anchor, Math.abs(b-D.anchor)<0.05? D.anchor+0.4 : b]; D.anchor=null; render();});
}

}
setInterval(()=>{const el=document.getElementById('revtimer');
  if(el&&ST.rev){const s=Math.floor((Date.now()-ST.rev.t0)/1000);
    el.textContent=`${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;}},1000);

  const r=ST.rev; if(!r){ST.view='home';return vHome();}
  if(r.i>=r.list.length) return vReviewDone();

  const inval=a.inval??t.invalidation;
  const c=chartSVG(t,{invalidation:inval,showTarget:false});
  const dist=Math.abs(t.avgEntry-inval), risk=dist*OZ*t.lots, rM=t.netPnl/Math.max(.01,risk);
  return `<div class="topbar sep">
      <button class="back" onclick="if(confirm('Leave review?'))go('home')">‹ Exit</button>
      <div class="dots">${r.list.map((_,i)=>`<span class="dot ${i<r.i?'done':i===r.i?'now':''}"></span>`).join('')}</div>
      <span class="timer" id="revtimer">00:00</span></div>
  <div class="stack fade">
    <div class="between"><span class="eyebrow">Trade ${r.i+1} of ${r.list.length}</span>
      <span class="tiny num">${hhmm(t.minute)} · ${t.dir} · ${t.lots} lots</span></div>
    <div class="chartwrap"><div id="tapchart" style="cursor:crosshair">${c.svg}</div></div>
    <p class="hint" style="margin-top:-4px">Tap the chart where the idea was invalid${a.inval?' — tap again to adjust':''}</p>
    <div class="card" style="padding:13px"><div class="between">
      <div><div class="tiny">Invalidation</div><div class="num" style="font-size:17px;font-weight:600">${inval.toFixed(2)}</div></div>
      <div style="text-align:right"><div class="tiny">Risk / result</div>
        <div class="num" style="font-size:17px;font-weight:600">$${risk.toFixed(2)} · <span class="${rM>0?'pos':'neg'}">${rfmt(rM)}</span></div></div>
    </div>${a.inval?'':`<div class="tiny" style="margin-top:8px">Proposed from your zone geometry.</div>`}</div>
    <div><div class="eyebrow" style="margin-bottom:8px">Setup</div>
      <div class="chips">${SETUPS.map(s=>`<button class="chip" aria-pressed="${a.setup===s.n}" onclick="pickSetup('${s.n}')">${s.n}</button>`).join('')}</div></div>
    <div><div class="eyebrow" style="margin-bottom:6px">Confluence <span style="text-transform:none;letter-spacing:0;font-weight:400">— ${t.conf.length} auto-detected</span></div>
      ${CONF_GROUPS.map(g=>`<div class="grpttl">${g.g}</div><div class="chips">${g.items.map(([n])=>{
        const on=a.conf.length?a.conf.includes(n):t.conf.includes(n);
        return `<button class="chip" aria-pressed="${on}" onclick="toggleConf('${esc(n)}')">${n}</button>`;}).join('')}</div>`).join('')}</div>
    <div><div class="eyebrow" style="margin-bottom:8px">Note (optional)</div>
      <textarea class="note" style="min-height:62px" placeholder="One line is plenty" oninput="ST.rev.answers[ST.rev.i].note=this.value">${esc(a.note)}</textarea></div>
    <button class="btn" onclick="nextRev()">${r.i===r.list.length-1?'Finish review':'Next trade'}</button>
    <button class="btn ghost" onclick="nextRev(true)">Skip</button>

}
function vReviewDone(){
  const r=ST.rev, secs=Math.floor((Date.now()-r.t0)/1000), pass=secs<=120;
  return topbar('Review complete','home')+`<div class="stack fade" style="padding-top:18px">
    <div class="card" style="text-align:center;padding:26px 16px">
      <div class="eyebrow">Time taken</div>
      <div class="done-fig ${pass?'pos':'neg'}">${String(Math.floor(secs/60)).padStart(2,'0')}:${String(secs%60).padStart(2,'0')}</div>
      <div class="tiny" style="margin-top:6px">${r.list.length} zone trades · ${(secs/r.list.length).toFixed(1)}s each</div>
      <div style="margin-top:16px;font-size:13.5px;line-height:1.5">${pass?'Inside the two-minute budget. The review flow works at this frequency.':'Over the two-minute budget — the brief says cut inputs until it fits.'}</div>
    </div>
    <button class="btn" onclick="openWeek(${WEEKS.length-1})">Open weekly review</button>
    <button class="btn ghost" onclick="go('home')">Done</button>
  </div>`;
}
function pickSetup(s){ST.rev.answers[ST.rev.i].setup=s;render();}
function toggleConf(c){const a=ST.rev.answers[ST.rev.i],t=ST.rev.list[ST.rev.i];
  if(!a.conf.length)a.conf=[...t.conf];
  const i=a.conf.indexOf(c); i>=0?a.conf.splice(i,1):a.conf.push(c); render();}
function nextRev(skip){const r=ST.rev; if(!skip)r.list[r.i].reviewed=true; r.i++; render();
  const sc=document.querySelector('.scroll'); if(sc)sc.scrollTop=0;}
function bindTap(){
  const host=document.getElementById('tapchart'); if(!host||!ST.rev)return;
  const svg=host.querySelector('svg'); if(!svg)return;
  const t=ST.rev.list[ST.rev.i];
  const meta=chartSVG(t,{invalidation:ST.rev.answers[ST.rev.i].inval??t.invalidation,showTarget:false});
  svg.addEventListener('click',e=>{const r=svg.getBoundingClientRect();
    const y=(e.clientY-r.top)/r.height*meta.H;
    ST.rev.answers[ST.rev.i].inval=+(meta.hi-(meta.hi-meta.lo)*Math.max(0,Math.min(1,(y-meta.T)/meta.ph))).toFixed(2);
    render();});
}

const WK_NOTES={};
function vWeek(){
  const w=WEEKS[ST.week], prev=ST.week>0?WEEKS[ST.week-1]:null;
  const best=[...w.trades].sort((a,b)=>b.rMult-a.rMult)[0];
  const worst=[...w.trades].sort((a,b)=>a.rMult-b.rMult)[0];
  const marg=CONF.map(c=>marginal(w.trades,c.n)).filter(Boolean).sort((a,b)=>b.value-a.value);
  const bySetup=segment(w.trades,t=>t.setup,{minN:5});
  const delta=(a,b)=>prev?`<span class="tiny ${a>=b?'pos':'neg'}">${a>=b?'▲':'▼'} ${Math.abs(a-b).toFixed(2)}</span>`:'';
  return topbar(`Week of ${shortDate(w.start)}`,'home',
    `<div class="row">${ST.week>0?`<button class="iconbtn" onclick="openWeek(${ST.week-1})">‹</button>`:''}
     ${ST.week<WEEKS.length-1?`<button class="iconbtn" onclick="openWeek(${ST.week+1})">›</button>`:''}</div>`)
  +`<div class="stack fade">
    <div class="kpi6">
      <div class="c"><div class="v ${w.net>0?'pos':'neg'}">${money(w.net,0)}</div><div class="k">Net</div><div class="x">${rfmt(w.rSum)}</div></div>
      <div class="c"><div class="v">${pct(w.wr)}</div><div class="k">Win rate</div><div class="x">${prev?'was '+pct(prev.wr):'—'}</div></div>
      <div class="c"><div class="v">${w.pf.toFixed(2)}</div><div class="k">Profit factor</div><div class="x">${delta(w.pf,prev?prev.pf:0)}</div></div>
      <div class="c"><div class="v ${w.expR>0?'pos':'neg'}">${w.expR.toFixed(2)}R</div><div class="k">Expectancy</div><div class="x">${prev?'was '+prev.expR.toFixed(2)+'R':'—'}</div></div>
      <div class="c"><div class="v">${w.n}</div><div class="k">Zone trades</div><div class="x">${w.days.length} sessions</div></div>
      <div class="c"><div class="v">${gradeOf(w.score)}</div><div class="k">Execution</div><div class="x">${w.score}/100</div></div>
    </div>

    ${card('This week by setup',null,hbars(bySetup.map(r=>({label:r.label,value:r.value,n:r.n})),{fmt:rfmt,aria:'Weekly expectancy by setup'}),'')}
    ${marg.length?card('What carried the week',null,
      hbars(marg.slice(0,6).map(m=>({label:m.label,value:m.value,n:m.n})),{fmt:rfmt,padL:118,aria:'Weekly confluence marginal value'}),
      `Small weekly samples — treat these as a direction, not a conclusion.`):''}

    <div class="card">
      <div class="eyebrow" style="margin-bottom:9px">Best and worst</div>
      ${[['Best',best],['Worst',worst]].map(([l,t])=>`
        <button class="wkrow" style="border-top:1px solid var(--line);padding-left:0;padding-right:0" onclick="openTrade(${t.id})">
          <span><span class="tiny">${l}</span><div style="font-size:13.5px;font-weight:600">${esc(t.setup)}</div>
            <div class="tiny num">${shortDate(t.date)} ${hhmm(t.minute)} · ${t.conf.length} confluences</div></span>
          <span class="num ${t.rMult>0?'pos':'neg'}" style="font-weight:600">${rfmt(t.rMult)}</span>
          <span style="color:var(--ink3)">›</span></button>`).join('')}
    </div>

    <div class="card">
      <div class="eyebrow" style="margin-bottom:9px">Reflection</div>
      ${[['went','What went well?'],['badly','What went badly?'],['rule',"One rule for next week"]].map(([k,q])=>`
        <div style="margin-bottom:10px"><div class="tiny" style="margin-bottom:5px">${q}</div>
          <textarea class="note" style="min-height:54px" oninput="WK_NOTES['${ST.week}-${k}']=this.value">${esc(WK_NOTES[ST.week+'-'+k]||'')}</textarea></div>`).join('')}
    </div>
    <div class="sectionhead"><h2>Sessions</h2></div>
    <div class="tlist">${w.days.map(d=>`<button class="wkrow" onclick="openDay(${DAYS.indexOf(d)})">
      <span><div style="font-size:13.5px;font-weight:600">${fmtDate(d.date)}</div>
        <div class="tiny num">${d.trades.length} trades · ${pct(d.wr)} win · ${d.regime} vol</div></span>
      <span class="num ${d.net>0?'pos':'neg'}" style="font-weight:600">${money(d.net,0)}</span>
      <span style="color:var(--ink3)">›</span></button>`).join('')}</div>
  </div>`;
}

/* ---------------------------- MORE / COST ---------------------------- */
function vMore(){
  const st=stats(ALL);
  const lo=st.lots*OZ*0.15, hi=st.lots*OZ*0.30;
  const grossLo=st.net+lo, grossHi=st.net+hi;
  const proCost=st.lots*0.20*OZ, rawCost=st.lots*(0.05*OZ+7);
  const cvd=document.documentElement.getAttribute('data-cvd')==='on';
  const avgWinMove=st.avgWin/(OZ*(st.lots/ALL.length));
  return topbar('More','')+`<div class="stack fade">
    ${card('What the spread costs you','It is inside your fill price, not a separate charge — so your net profit is already after it.',
      hbars([{label:'Net profit (reported)',value:st.net,n:st.n},
             {label:'Spread paid (est.)',value:-((lo+hi)/2),n:st.n},
             {label:'Gross before spread',value:(grossLo+grossHi)/2,n:st.n}],
        {fmt:v=>money(v,0),padL:118,aria:'Net profit against spread cost'}),
      `You did not lose this on top of your P&L — it is already deducted, because your fills are at bid/ask.
       The right reading: <b>your edge is ${money0((grossLo+grossHi)/2)} and you keep ${money0(st.net)} of it.</b>
       The spread is a hurdle every trade clears, not a hidden charge.`)}
    ${card('Cost against the move you reach for',null,
      hbars([{label:'Avg winning move',value:avgWinMove,n:st.wins},{label:'Spread crossed',value:-0.22,n:st.n}],
        {fmt:v=>'$'+Math.abs(v).toFixed(2),padL:110,aria:'Average winning move against spread'}),
      `<b>${(0.22/avgWinMove*100).toFixed(0)}% of the move you are reaching for</b> goes to the spread — and it is crossed on losers too. That share is the number to attack, and account type is the lever.`)}
    ${card('Account type · at '+st.lots.toFixed(1)+' lots','Spread against commission. Arithmetic once volume is known.',
      hbars([{label:'Pro (current)',value:-proCost,n:null},{label:'Raw Spread',value:-rawCost,n:null}],
        {fmt:v=>money0(v),padL:100,aria:'Cost by account type'}),
      `Difference: <b class="pos">${money0(proCost-rawCost)}</b> over this period — about ${((proCost-rawCost)/st.net*100).toFixed(0)}% more kept, for no change in how you trade.
       Verify against your own measured spread: advertised is not paid, and tighter quotes can come with worse fills.`)}
    <div class="card">
      <div class="between"><div style="flex:1"><div style="font-size:14px;font-weight:600">Colour-safe profit / loss</div>
        <div class="tiny" style="margin-top:3px">Swaps loss from red to orange. Default pair measures ΔE 6.5 under protanopia; this one 9.4.</div></div>
        <button class="chip" aria-pressed="${cvd}" onclick="toggleCVD()">${cvd?'On':'Off'}</button></div>
    </div>
    <div class="card">
      <div class="eyebrow" style="margin-bottom:8px">About</div>
      <div style="font-size:13.5px;line-height:1.55;color:var(--ink2)">All data is synthetic, generated to the shape of a high-frequency XAUUSD account.
      Confluence factors carry real weights in the generator, so the marginal-value chart is recovering a signal that is genuinely there — that is the test of whether the analysis works.</div>
    </div>
  </div>`;
}
function toggleCVD(){const r=document.documentElement;
  r.setAttribute('data-cvd',r.getAttribute('data-cvd')==='on'?'off':'on');render();}

/* ---------------------------- ROUTER ---------------------------- */
const TABS=[['home','Home','M3 9l7-6 7 6v9a1 1 0 0 1-1 1h-4v-5H8v5H4a1 1 0 0 1-1-1z'],
 ['trades','Trades','M4 4h12v12H4zM7 8h6M7 11h4'],
 ['analytics','Analytics','M4 16V9M8 16V5M12 16v-5M16 16V7'],
 ['review','Review','M3 5h14v13H3zM3 9h14M7 3v3M13 3v3'],
 ['more','More','M3 6h14M3 10h14M3 14h14']];
function go(v){ if(v==='review'&&(!ST.rev||ST.rev.i>=ST.rev.list.length)){startReview();return;}
  ST.view=v;render();const sc=document.querySelector('.scroll');if(sc)sc.scrollTop=0;}
function openDay(i){ST.day=i;ST.view='day';render();}
function openWeek(i){ST.week=i;ST.view='week';render();window.scrollTo(0,0);
  const sc=document.querySelector('.scroll');if(sc)sc.scrollTop=0;}
function openTrade(id){ST.trade=id;ST.draw={mode:null,zone:null,inval:null,target:null,anchor:null};
  if(ST.day===null)ST.day=DAYS.findIndex(d=>d.trades.some(t=>t.id===id));
  ST.view='trade';render();const sc=document.querySelector('.scroll');if(sc)sc.scrollTop=0;}
function render(){
  const V={home:vHome,trades:vTrades,analytics:vAnalytics,calendar:vCalendar,day:vDay,
           trade:vTrade,review:vReview,week:vWeek,more:vMore};
  document.getElementById('view').innerHTML=(V[ST.view]||vHome)();
  const vw=document.getElementById('view'), tb=vw.querySelector('.topbar'), top=document.getElementById('top');
  top.innerHTML=''; if(tb) top.appendChild(tb);
  const act={calendar:'home',day:'home',trade:'trades',week:'review'}[ST.view]||ST.view;
  document.getElementById('tabs').innerHTML=TABS.map(([k,l,d])=>
    `<button class="tab" ${act===k?'aria-current="page"':''} onclick="go('${k}')">
      <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="${d}"/></svg>
      <span>${l}</span></button>`).join('');
  if(ST.view==='review') bindTap();
  if(ST.view==='trade') bindDraw();
}
render();
</script>
